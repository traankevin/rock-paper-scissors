<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>

    <title>Rock Paper Scissors</title>
</head>
<body>
    <div class="choices">
        <h1>Welcome to Rock Paper Scissors!</h1>
        <div class="player_choice">
            <button id="rock_player">
                <img src ="images/rock.png" alt="rock image">
            </button>
            <button id="paper_player">
                <img src ="images/paper.png" alt="paper image">
            </button>
            <button id="scissors_player">
                <img src ="images/scissors.png" alt="scissors image">
            </button>
        </div>

        <div class="announce">
            <p>Will you win?</p>
            <p id="winner"></p>
        </div>

        <div class="prompt">
        </div>

        <div class="gameover">
            <p>Gameover!</p>
            <p id="game_winner"></p>
            <button id="replay">
                <img src="images/replay.png" alt="replay button">
            </button>
        </div>
    </div>
</body>
</html>
