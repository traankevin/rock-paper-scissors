<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>

    <title>Rock Paper Scissors</title>
</head>
<body>
    <div class="choices">
        <div class="computer_choice">
            <button id="rock">
                <img src ="images/rock.png" alt="rock image">
            </button>
            <button id="paper">
                <img src ="images/paper.png" alt="paper image">
            </button>
            <button id="scissors">
                <img src ="images/scissors.png" alt="scissors image">
            </button>
        </div>

        <div class="player_choice">
            <button id="rock_player">
                <img src ="images/rock.png" alt="rock image">
            </button>
            <button id="paper_player">
                <img src ="images/paper.png" alt="paper image">
            </button>
            <button id="scissors_player">
                <img src ="images/scissors.png" alt="scissors image">
            </button>
        </div>
    </div>

    <div class="prompt">
        <h1>Rock Paper Scissors</h1>
        <p>Player Score: 0</p>
        <p>Computer Score: 0</p>
    </div>

</body>
</html>
